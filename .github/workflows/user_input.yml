name: Testing User Input workflow

on:
  workflow_dispatch:
    inputs:
      number1:
        description: 'First number'
        required: true
        default: '0'
      number2:
        description: 'Second number'
        required: true
        default: '0'      

jobs:
  add_numbers:
    runs-on: ubuntu-latest
    
    steps:
      - name: Add Numbers
        id: sum
        run: |
          # Safely assign the inputs to local environment variables first
          NUM1=${{ github.event.inputs.number1 }}
          NUM2=${{ github.event.inputs.number2 }}
          
          # Perform the math using Bash
          TOTAL=$(( NUM1 + NUM2 ))
          
          # Save it to outputs using the modern syntax
          echo "sum=$TOTAL" >> $GITHUB_OUTPUT